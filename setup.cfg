[metadata]
name = image-edit-workbench
version = 0.1.0
description = Deterministic local workbench for v1/v2 image-edit exchange interoperability and incremental diagnostics
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    numpy>=1.24
    Pillow>=10.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    image-edit-workbench = image_edit_workbench.cli:main
