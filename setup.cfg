[metadata]
name = haptic-diag
version = 0.1.0
description = Deterministic haptic protocol diagnostics workbench
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    numpy>=2.0,<3

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=8

[options.entry_points]
console_scripts =
    haptic-diag = haptic_diag.cli:main
    haptic-diag-server = haptic_diag.device_server:main
