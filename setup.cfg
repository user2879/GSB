[metadata]
name = pref-reward-lab
version = 0.1.0
description = Deterministic local LLM preference-reward interoperability and reproducibility lab
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8.0
    numpy>=1.26

[options.entry_points]
console_scripts =
    pref-reward-lab = pref_reward_lab.cli:main

