[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-upgrade-arbitration"
version = "1.0.0"
description = "Deterministic local upgrade-arbitration workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
arbitration-workbench = "arbitration_workbench.cli:main"

[tool.setuptools]
packages = ["arbitration_workbench"]

