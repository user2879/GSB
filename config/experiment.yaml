experiment_name: tabcluster-demo
seed: 20240501
sample_scale: small
preprocess:
  method: quantile        # standard | quantile
methods:
  kmeans:
    n_clusters: [2, 3, 4]
  dbscan:
    eps: [0.15, 0.25]
    min_samples: [4, 8]
  gmm:
    n_components: [2, 3]
    covariance_type: [full, diag]
metrics: [silhouette, calinski_harabasz, log_likelihood]
budget:
  global_iterations: 100000
  candidate_quota: 1000
concurrency: 4
snapshot:
  interval: 2
kmeans:
  max_iter: 60
gmm:
  max_iter: 80
  tol: 1.0e-6
  reg_covar: 1.0e-6
