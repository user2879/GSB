schema_version: 1
data:
  id_field: id
  label_field: label
  split_field: split
  numeric_columns:
  - age
  - income
  categorical_columns:
  - region
  - channel
  categorical_domains:
    region:
    - east
    - west
    - north
    - south
    channel:
    - web
    - store
    - partner
features:
  bins: 4
training:
  selected_candidate: 0
  candidates:
  - id: balanced
    initial_weight_scale: 0.05
    initial_bias: 0.0
    l2: 0.001
  - id: regularized
    initial_weight_scale: 0.02
    initial_bias: 0.0
    l2: 0.01
  batch_size: 4
  learning_rate: 0.1
  epochs: 4
quantization:
  fractional_bits: 12
  scale_level: 4
concurrency:
  max_workers: 1
  max_workers_limit: 8
  batch_budget: 3
snapshot:
  commit_interval_batches: 1
