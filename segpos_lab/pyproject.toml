[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segpos-lab"
version = "1.0.0"
description = "Chinese word segmentation and POS tagging incremental interactive component"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
where = ["src"]
