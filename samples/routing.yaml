domains:
  account:
    triggers:
    - term: 账号
      weight: 3
    - term: 登录
      weight: 2
    - term: 密码
      weight: 4
    - term: 验证码
      weight: 2
    - term: 冻结
      weight: 3
    - term: 解冻
      weight: 2
    - term: 手机号
      weight: 1
    - term: 发送
      weight: 1
    - term: 收到
      weight: 1
    intents:
      password_reset:
        triggers:
        - term: 忘记密码
          weight: 5
        - term: 重置密码
          weight: 5
        - term: 修改密码
          weight: 3
        - term: 密码
          weight: 1
        slot_patterns:
        - phone_after_label
        required_slots:
        - phone
      account_unfreeze:
        triggers:
        - term: 账号冻结
          weight: 5
        - term: 解冻
          weight: 5
        - term: 冻结
          weight: 2
        slot_patterns:
        - reason_after_label
        required_slots:
        - reason
      verification_code:
        triggers:
        - term: 验证码
          weight: 5
        - term: 收不到
          weight: 3
        - term: 发送
          weight: 2
        - term: 手机号
          weight: 1
        slot_patterns:
        - phone_after_label
        required_slots:
        - phone
  billing:
    triggers:
    - term: 账单
      weight: 3
    - term: 扣费
      weight: 4
    - term: 退款
      weight: 2
    - term: 发票
      weight: 3
    - term: 支付
      weight: 2
    - term: 订单
      weight: 2
    intents:
      refund_status:
        triggers:
        - term: 退款
          weight: 5
        - term: 进度
          weight: 2
        - term: 到账
          weight: 3
        slot_patterns:
        - order_after_label
        required_slots:
        - order_id
      invoice_change:
        triggers:
        - term: 发票
          weight: 5
        - term: 抬头
          weight: 3
        - term: 修改
          weight: 2
        - term: 发票号
          weight: 4
        slot_patterns:
        - invoice_after_label
        required_slots:
        - invoice_id
      duplicate_charge:
        triggers:
        - term: 重复扣费
          weight: 5
        - term: 扣费
          weight: 4
        - term: 两次
          weight: 2
        slot_patterns:
        - order_after_label
        required_slots:
        - order_id
slot_patterns:
  phone_after_label:
    name: phone_after_label
    intent: password_reset
    slot: phone
    tokens:
    - 手机号
    - '{phone}'
    window: 2
    direction: after
  reason_after_label:
    name: reason_after_label
    intent: account_unfreeze
    slot: reason
    tokens:
    - 原因
    - '{reason}'
    window: 2
    direction: after
  order_after_label:
    name: order_after_label
    intent: refund_status
    slot: order_id
    tokens:
    - 订单号
    - '{order_id}'
    window: 2
    direction: after
  invoice_after_label:
    name: invoice_after_label
    intent: invoice_change
    slot: invoice_id
    tokens:
    - 发票号
    - '{invoice_id}'
    window: 2
    direction: after
slots:
  phone:
    type: phone
  reason:
    type: text
  order_id:
    type: order_id
  invoice_id:
    type: invoice_id
required_slots:
  password_reset:
  - phone
  account_unfreeze:
  - reason
  verification_code:
  - phone
  refund_status:
  - order_id
  invoice_change:
  - invoice_id
  duplicate_charge:
  - order_id
negation_rules:
- negators:
  - 不是
  - 没有
  - 并未
  scope: 2
  mode: cancel
  direction: before
thresholds:
  domain: '0.20'
  intent: '0.20'
fixed_decimals: 5
quantization_levels: 100000
thread_pool_size: 4
max_thread_pool_size: 8
batch_point_budget: 4096
snapshot_interval_commands: 2
recalibration:
  completeness_weight: '0.12'
  suppression_penalty: '0.03'
  minimum: '0.0'
  maximum: '1.0'
  suppression_cap: 4
