version: 1
seed: 20261119
model:
  layers: 2
  hidden_dim: 8
  layer_tensors:
  - name: weight
    shape:
    - hidden_dim
    - hidden_dim
  - name: bias
    shape:
    - hidden_dim
steps: 4
data_parallel_workers: 3
compression:
  candidates:
  - scheme: symmetric
    bits:
    - 8
    - 6
    - 4
  - scheme: asymmetric
    bits:
    - 8
    - 6
    - 4
  window_steps: 1
  max_bytes_per_window: 65536
aggregation:
  mode: mean
  order: auto
fidelity_generations: 2
concurrency: 4
snapshot_interval_steps: 1
communication_error_tolerance: 0.001
snapshot_dir: runtime/snapshots
