snapshot_version: 1
allowed_bit_widths: [2, 3, 4, 5, 6, 8, 16]
latency_budget_ms: 20
max_threads: 3
thread_limit: 8
point_batch_budget: 64
snapshot_commit_interval: 2
distillation_temperature: 1.25
significant_digits: 7
worker_delay_ms: 1.5
defaults:
  bits: 8
  group_size: 4
  fractional_bits: 4
  scheme: "symmetric"
layers:
  layer.0:
    bits: 8
    group_size: 4
    fractional_bits: 5
    scheme: "symmetric"
  layer.1:
    bits: 8
    group_size: 4
    fractional_bits: 4
    scheme: "symmetric"
  layer.2:
    bits: 6
    group_size: 2
    fractional_bits: 3
    scheme: "asymmetric"
  layer.3:
    bits: 8
    group_size: 4
    fractional_bits: 4
    scheme: "symmetric"
  layer.4:
    bits: 4
    group_size: 2
    fractional_bits: 2
    scheme: "symmetric"
