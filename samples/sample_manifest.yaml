# Deterministic synthetic sample manifest.
# Shard boundaries and lengths are declared here; the generator must follow them.
sample_id: aed_deterministic_demo
seed: 20261118
wav:
  path: samples/aed_synthetic.wav
  sample_rate_hz: 16000
  channels: 1
  sample_width_bits: 16
  duration_ms: 4000
shards:
  - shard_id: shard_01
    start_ms: 0
    end_ms: 800
    header:
      frame_grid_version: frame_grid_v1
      codebook_version: codebook_v2
  - shard_id: shard_02
    start_ms: 800
    end_ms: 1600
    header:
      frame_grid_version: frame_grid_v1
      codebook_version: codebook_v1   # semantic name mapping, different code points
  - shard_id: shard_03
    start_ms: 1600
    end_ms: 2400
    header:
      frame_grid_version: frame_grid_v1
      codebook_version: codebook_v2
      inject_unmapped_code: "50"      # dog_bark cannot map to the canonical classes
  - shard_id: shard_04
    start_ms: 2400
    end_ms: 3200
    header:
      frame_grid_version: frame_grid_v2  # 8 ms shift, requires resampling
      codebook_version: codebook_v2
  - shard_id: shard_05
    start_ms: 3200
    end_ms: 4000
    header:
      frame_grid_version: frame_grid_v1
      codebook_version: codebook_v2
# Extra packages that must land in the failure list without stopping the run.
invalid_shards:
  - shard_id: shard_bad_align
    start_ms: 125      # not divisible by the 10 ms frame shift
    end_ms: 525
    header:
      frame_grid_version: frame_grid_v1
      codebook_version: codebook_v2
  - shard_id: shard_bad_prob
    start_ms: 600
    end_ms: 900
    header:
      frame_grid_version: frame_grid_v1
      codebook_version: codebook_v2
    inject_probability_violation: true
  - shard_id: shard_bad_len
    start_ms: 2000
    end_ms: 2300
    header:
      frame_grid_version: frame_grid_v1
      codebook_version: codebook_v2
    inject_length_mismatch: true
