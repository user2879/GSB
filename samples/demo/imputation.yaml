format: 1
seed: 20261121
id_column: row_id
target_column: churn
decimal_places: 2
quantization_level: 5
rounding: half_even
thread_pool_workers: 4
batch_cell_budget: 12
snapshot_interval_batches: 1
validation_fraction: 0.25
model:
  learning_rate: 0.12
  epochs: 36
  batch_size: 4
  l2: 0.002
columns:
  age:
    type: numeric
    imputer: median
    min_valid_samples: 3
    fallback: 33.0
  income:
    type: numeric
    imputer: mean_noise
    noise_coefficient: 0.22
    min_valid_samples: 3
    fallback: 60.0
  score:
    type: numeric
    imputer: grouped_median
    group_key: region
    min_valid_samples: 3
    fallback: 55.0
  city:
    type: category
    imputer: mode
    domain:
    - delta
    - harbor
    - hill
    - metro
    - plain
    - river
    min_valid_samples: 3
    fallback: river
  region:
    type: category
    imputer: constant
    domain:
    - north
    - south
    - east
    - west
    - central
    - unmapped
    min_valid_samples: 1
    constant: north
    fallback: north
  plan:
    type: category
    imputer: constant
    domain:
    - basic
    - plus
    - pro
    min_valid_samples: 1
    constant: basic
    fallback: basic
  churn:
    type: numeric
    imputer: constant
    min_valid_samples: 1
    constant: 0
    fallback: 0
