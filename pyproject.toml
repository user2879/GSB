[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-config-pipeline"
version = "1.0.0"
description = "Deterministic local multi-cluster configuration distribution and recovery pipeline"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
config-pipeline = "config_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["config_pipeline*"]
