[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcdiag"
version = "1.0.0"
description = "Deterministic cache-hit diagnostics for an offline layered feature pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["numpy>=1.26", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["fcdiag*"]
