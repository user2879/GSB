[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-crossing-pipeline"
version = "1.1.0"
description = "Deterministic cross-feature and dimensionality-reduction audit pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["feature_pipeline"]
