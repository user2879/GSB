[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowdiag-workbench"
version = "1.0.0"
description = "Deterministic multi-source slow-query evidence diagnostic workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
slowdiag = "slowdiag.cli:main"

[tool.setuptools.packages.find]
include = ["slowdiag*"]
