[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-fingerprint-diagnostics"
version = "1.0.0"
description = "Deterministic local audio fingerprint retrieval, invalidation and recovery diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
afp = "audio_fingerprint.cli:main"

[tool.setuptools.packages.find]
include = ["audio_fingerprint*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
