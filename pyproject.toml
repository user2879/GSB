[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibstream"
version = "0.1.0"
description = "Deterministic streaming vibration-window analytics demo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2"]

[project.scripts]
vibstream = "vibstream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools]
packages = ["vibstream"]
