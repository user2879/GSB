[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-retarget-workbench"
version = "0.1.0"
description = "Deterministic multi-camera motion capture retargeting and constraint workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
mocap-workbench = "mocap_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["mocap_workbench*"]
