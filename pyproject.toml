[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-clean-workbench"
version = "1.0.0"
description = "Deterministic motion-capture waste-frame audit and sparse key-pose repair workbench"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "PySide6>=6.7,<6.10",
]

[project.scripts]
mocap-workbench = "mocap_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["mocap_workbench*"]

