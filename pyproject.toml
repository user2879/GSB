[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-diagnostics-workbench"
version = "1.0.0"
description = "Deterministic long-context positional-encoding extrapolation diagnostics workbench"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
include = ["pe_workbench*"]
