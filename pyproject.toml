[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp-observer-ledger"
version = "1.0.0"
description = "Deterministic local TCP state observation, receipt normalization, sealed windows, and crash recovery"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
tcp-observer = "tcp_observer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start = "tests"
