[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limiter-diag"
version = "0.1.0"
description = "Deterministic three-stage fixed-point token-bucket diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
limiter-diag = "limiter_diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

