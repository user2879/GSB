[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tile-anomaly"
version = "0.1.0"
description = "Deterministic incremental multi-band tile anomaly detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.scripts]
tile-anomaly = "tile_anomaly.cli:main"

[tool.setuptools.packages.find]
include = ["tile_anomaly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

