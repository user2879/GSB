[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cm-fusion-retrieval"
version = "0.1.0"
description = "Deterministic cross-modal retrieval and consistency verifier"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<2"]

[tool.setuptools.packages.find]
include = ["cm_fusion*"]

