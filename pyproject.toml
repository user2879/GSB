[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "config-arbiter"
version = "1.0.0"
description = "Cross-environment configuration arbitration and consistency diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
config-arbiter = "config_arbiter.cli:main"

[tool.setuptools.packages.find]
include = ["config_arbiter*"]
