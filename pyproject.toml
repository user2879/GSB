[build-system]
requires = []
build-backend = "setuptools.build_meta"

[project]
name = "photometric-altopt"
version = "1.0.0"
description = "Multi-view photometric stereo and differentiable rendering alternating optimization (NumPy only)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["photometric_altopt"]
