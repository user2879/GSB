[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "condfusion-diagnostic"
version = "1.0.0"
description = "Deterministic fixed-point text/image/motion fusion and tile-render diagnostic component"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6.0"]

[project.scripts]
condrender = "condrender.cli:main"

[tool.setuptools.packages.find]
include = ["condrender*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
