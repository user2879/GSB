[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-diag-workbench"
version = "0.1.0"
description = "Deterministic feature-crossing and dimensionality-reduction precision diagnostics workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "PyYAML==6.0.2",
]

[project.scripts]
feature-diag = "feature_diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
