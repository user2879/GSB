[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-material-gen"
version = "1.0.0"
description = "Deterministic fixed-point texture and material generation component"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "Pillow==10.3.0",
]

[project.scripts]
matgen = "matgen.cli:main"

[tool.setuptools.packages.find]
include = ["matgen*", "scripts*"]
