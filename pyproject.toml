[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventbus-diag"
version = "1.0.0"
description = "Local deterministic event-bus streaming integration diagnostic bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
eventbus-diag = "eventbus_diag.cli:main"

[tool.setuptools.packages.find]
include = ["eventbus_diag*"]

[tool.setuptools]
include-package-data = true
