[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-review-workbench"
version = "1.0.0"
description = "Deterministic scale-decision review workbench with leases and replayable ledger"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
scale-review = "scale_review.cli:main"

[tool.setuptools.packages.find]
include = ["scale_review*"]
