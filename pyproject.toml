[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlschain-fixedpoint"
version = "1.0.0"
description = "Deterministic loopback TLS handshake and integer fixed-point certificate-chain verification component"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
numerical = ["numpy==1.26.4"]

[project.scripts]
tlschain = "tlschain.cli:main"

[tool.setuptools.packages.find]
include = ["tlschain*"]

[tool.setuptools]
include-package-data = true
