[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlcb"
version = "1.0.0"
description = "Local deterministic multi-service rate-limit, circuit-breaker and degradation chain"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
rlcb = "rlcb.cli:main"
rlcb-worker = "rlcb.worker:run_service"

[tool.setuptools]
packages = ["rlcb"]
