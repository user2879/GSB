[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckptmeta"
version = "0.1.0"
description = "Deterministic training checkpoint metadata interoperability toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ckptmeta = "ckptmeta.cli:main"

[tool.setuptools.packages.find]
include = ["ckptmeta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
