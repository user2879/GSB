[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-diag"
version = "0.1.0"
description = "Deterministic inference receipt normalization, invalidation and recovery diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
receipt-diag = "receipt_diag.cli:main"

[tool.setuptools.packages.find]
include = ["receipt_diag*"]
