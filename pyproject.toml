[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecal"
version = "1.0.0"
description = "Deterministic acoustic-evidence chain calibration for synthetic dialogue speech"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools]
packages = ["voicecal"]
