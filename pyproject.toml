[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancient-vlayout"
version = "1.0.0"
description = "Deterministic vertical ancient-layout recognition with stage snapshots"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pillow==10.3.0",
]

[project.optional-dependencies]
test = ["pytest==8.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ancient_vlayout*"]
