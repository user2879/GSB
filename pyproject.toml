[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexicon-pipeline"
version = "1.0.0"
description = "Deterministic controlled-vocabulary segmentation, fixed-point POS tagging, ledger and exchange pipeline"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
include = ["lexicon_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
