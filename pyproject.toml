[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardflow"
version = "1.0.0"
description = "Deterministic multi-node sharded compute orchestration with leases and a durable ledger"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4"]

[project.scripts]
shardflow = "shardflow.cli:main"

[tool.setuptools]
packages = ["shardflow"]

[tool.setuptools.package-data]
shardflow = ["py.typed"]
