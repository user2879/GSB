[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkdeps-workbench"
version = "1.0.0"
description = "Local deterministic chunk upload and metadata dependency diagnostics workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chunkdeps = "chunkdeps.cli:main"
chunkdeps-ui = "chunkdeps.ui:main"

[tool.setuptools]
packages = ["chunkdeps"]

