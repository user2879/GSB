[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-vad"
version = "1.0.0"
description = "Deterministic scale-adaptive VAD with staged caches and resumable snapshots"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["vad*"]
