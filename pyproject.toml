[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmwin"
version = "1.0.0"
description = "Deterministic streaming multimodal event-window aggregation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
mmwin = "mmwin.cli:main"

[tool.setuptools.packages.find]
include = ["mmwin*"]
