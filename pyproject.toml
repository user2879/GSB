[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-interop"
version = "0.1.0"
description = "Deterministic f1/f2/f3 tunnel fragment interoperability lab"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.optional-dependencies]
test = ["pytest==8.2.0"]

[project.scripts]
tunnel-interop = "tunnel_interop.cli:main"

[tool.setuptools.packages.find]
include = ["tunnel_interop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
