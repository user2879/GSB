[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inpaint-pyramid-workbench"
version = "0.1.0"
description = "Deterministic multi-resolution inpainting and style-transfer diagnostic workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "PyYAML>=6"]

[project.scripts]
ipw = "inpaint_pyramid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

