[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-layout-workbench"
version = "0.1.0"
description = "Deterministic synthetic document layout reading-order workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9.0"]

[project.scripts]
layout-workbench = "layout_reader.cli:main"

[tool.setuptools.packages.find]
include = ["layout_reader*"]

