[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecache-consistency-workbench"
version = "1.0.0"
description = "Deterministic local edge-cache consistency and diagnostics workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
samples = ["numpy==1.26.4"]

[project.scripts]
edgecache = "edgecache.cli:main"

[tool.setuptools.packages.find]
include = ["edgecache*"]
