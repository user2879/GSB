[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-workbench"
version = "1.0.0"
description = "Deterministic hierarchical intent routing and slot filling workbench"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "PyYAML==6.0.1"]

[tool.setuptools.packages.find]
include = ["routing_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

