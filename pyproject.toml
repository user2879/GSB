[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-extrapolation-diagnostics"
version = "1.0.0"
description = "Deterministic, incremental RoPE extrapolation diagnostics for long-context LLM research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
rope-extrap = "rope_extrap.cli:main"

[tool.setuptools]
packages = ["rope_extrap", "scripts"]
