[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rts-pipeline"
version = "1.0.0"
description = "Deterministic RTS resource collection and unit scheduling verification pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
rts-pipeline = "rts_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["rts_pipeline*"]

[tool.ruff.lint]
ignore = ["BLE001"]
