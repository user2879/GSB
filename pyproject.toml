[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-workbench"
version = "0.1.0"
description = "Deterministic local synthetic layout text detection and recognition workbench"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
layout-workbench = "layout_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

