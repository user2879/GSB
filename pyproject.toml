[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srebudget-workbench"
version = "1.0.0"
description = "Deterministic service-call error budget and circuit breaker diagnostics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
srebudget = "srebudget.cli:main"

[tool.setuptools.packages.find]
include = ["srebudget*"]
