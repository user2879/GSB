[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch-local"
version = "1.0.0"
description = "Deterministic local deployment drift observation merge and diagnosis component"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
numeric = ["numpy>=1.24"]
dev = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.setuptools.packages.find]
include = ["driftwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
