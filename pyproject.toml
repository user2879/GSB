[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layerpack"
version = "1.0.0"
description = "Deterministic incremental fixed-point model compression and deployment packaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
layerpack = "layerpack.cli:main"

[tool.setuptools.packages.find]
include = ["layerpack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
