[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageagg"
version = "1.0.0"
description = "Deterministic columnar page aggregation with a local SQLite ledger"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
pageagg = "pageagg.cli:main"

[tool.setuptools.packages.find]
include = ["pageagg*"]

