[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layered-budget-workbench"
version = "1.0.0"
description = "Deterministic layered inpainting, style transfer, tile-budget and snapshot workbench"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow"]

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.unittest]
start = "tests"
