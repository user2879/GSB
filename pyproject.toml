[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-lease-platform"
version = "1.0.0"
description = "Edge-cache shard parallel scheduling and lease-ledger verification platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
edge-lease = "edge_lease.cli:main"

[tool.setuptools]
packages = ["edge_lease"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
