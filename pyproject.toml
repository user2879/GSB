[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-analyzer"
version = "1.0.0"
description = "Offline deterministic narrative branch and event-causality analyzer"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=5.4"]

[project.scripts]
narrative-analyzer = "narrative_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["narrative_analyzer*"]

