[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-corpus-workbench"
version = "0.1.0"
description = "Deterministic weighted sampling, MinHash deduplication and budgeted auditing for small local corpora"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
corpus-workbench = "corpus_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["corpus_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
