[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opchain"
version = "0.1.0"
description = "Deterministic incremental activation and permutation operator-chain editor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
opchain = "opchain.cli:main"

[tool.setuptools.packages.find]
include = ["opchain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

