[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcore-alert-correlation"
version = "1.0.0"
description = "Deterministic local alert correlation and root-cause localization ledger"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
arcore = "arcore.cli:main"
