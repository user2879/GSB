[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remix-workbench"
version = "0.1.0"
description = "Deterministic stem interchange and incremental remix workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
remix-workbench = "remix_workbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

