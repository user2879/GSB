[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imputation-workbench"
version = "0.1.0"
description = "Deterministic incremental missing-value imputation maintenance workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
imputation-workbench = "imputation_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["imputation_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
