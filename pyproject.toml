[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memdiag-workbench"
version = "1.0.0"
description = "Deterministic mixed-precision inference memory-budget diagnostics workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2"]

[project.scripts]
memdiag = "memdiag.cli:main"

[tool.setuptools.packages.find]
include = ["memdiag*"]
