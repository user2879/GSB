[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-audit-workbench"
version = "1.0.0"
description = "Deterministic local batch ownership scheduler and independent ledger auditor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.scripts]
batch-audit = "batch_audit.cli:main"

[tool.setuptools.packages.find]
include = ["batch_audit*"]
