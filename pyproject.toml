[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-burn"
version = "1.0.0"
description = "Local SLO error-budget burn diagnostics with dual-path judgement, leases and replayable ledger"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["slo_burn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
