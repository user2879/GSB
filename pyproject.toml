[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-instruction-factory"
version = "0.1.0"
description = "Deterministic, budget-aware local instruction-tuning data constructor"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
instruction-factory = "instruction_factory.cli:main"

[tool.setuptools.packages.find]
include = ["instruction_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

