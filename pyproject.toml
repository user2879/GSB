[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-recall-lab"
version = "1.0.0"
description = "Deterministic bilingual fusion recall, incremental ledger and snapshot scheduler"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
fusion-recall = "fusion_recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
