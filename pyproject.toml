[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detbox"
version = "0.1.0"
description = "Local synthetic candidate-box exchange and track consistency verifier"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "pytest"]

[project.scripts]
detbox = "detbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
