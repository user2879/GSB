[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgirecon"
version = "0.1.0"
description = "Fixed-point incremental multi-view reconstruction diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
mgirecon = "mgirecon.cli:main"

[tool.setuptools.packages.find]
include = ["mgirecon*"]
