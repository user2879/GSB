[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-transfer-pipeline"
version = "0.1.0"
description = "Deterministic incremental cross-task transfer learning on local CPU samples"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=5.4"]

[tool.setuptools]
packages = ["transfer_pipeline"]

