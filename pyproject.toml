[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vgcover-ledger"
version = "0.1.0"
description = "Deterministic vector-fill coverage, BGRA composition and recomputable error ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
vgcover = "vgcover.cli:main"

[tool.setuptools.packages.find]
include = ["vgcover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
