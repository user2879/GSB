[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shard-lease-diag"
version = "0.1.0"
description = "Deterministic local shard-route drift and shard-lease diagnostic toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
shard-diag = "shard_diag.cli:main"

[tool.setuptools.packages.find]
include = ["shard_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

