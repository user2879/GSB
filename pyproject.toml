[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-inference-gateway-diagnostics"
version = "1.0.0"
description = "Deterministic incremental routing receipts, invalidation diagnosis, and replay verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
gateway-diag = "gateway_diag.cli:main"
inference-mock = "gateway_diag.backend_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway_diag*"]
