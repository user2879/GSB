[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joinlab"
version = "1.0.0"
description = "Deterministic local join-order and cost-model laboratory"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4"]

[project.scripts]
joinlab = "joinlab.cli:main"

[tool.setuptools.packages.find]
include = ["joinlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

