[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-bench"
version = "1.0.0"
description = "Local deterministic multi-task LoRA incremental training and diagnostics workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
lora-bench = "lora_bench.cli:main"

[tool.setuptools.packages.find]
include = ["lora_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
