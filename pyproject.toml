[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-diag"
version = "0.1.0"
description = "Deterministic spectral colour adaptation diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
spectral-diag = "spectral_diag.cli:main"

[tool.setuptools.packages.find]
include = ["spectral_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
