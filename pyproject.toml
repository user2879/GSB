[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-occlusion-diagnostics"
version = "1.0.0"
description = "Deterministic Hi-Z occlusion culling and streaming diagnostics workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
terrain-diag = "terrain_diag.cli:main"

[tool.setuptools.packages.find]
include = ["terrain_diag*"]
