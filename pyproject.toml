[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-sample-pipeline"
version = "0.1.0"
description = "Deterministic incremental feature and training-sample pipeline for search and recommendation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
feature-pipeline = "feature_pipeline.cli:main"

[tool.setuptools]
packages = ["feature_pipeline"]

[tool.unittest]
start-directory = "tests"

