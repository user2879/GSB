[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsscene"
version = "0.1.0"
description = "Deterministic multi-resolution Gaussian scene pipeline with precise incremental invalidation"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pillow==10.3.0",
]

[tool.setuptools.packages.find]
include = ["gsscene*"]
