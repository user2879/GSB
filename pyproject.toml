[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-intent-workbench"
version = "1.0.0"
description = "Deterministic local e-commerce query intent diagnosis workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["search_intent_workbench*", "scripts*"]
