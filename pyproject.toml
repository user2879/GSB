[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timbre-lab"
version = "0.1.0"
description = "Deterministic speaker timbre analysis with interactive segment edits"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
timbre-lab = "timbre_lab.cli:main"

[tool.setuptools.packages.find]
include = ["timbre_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
