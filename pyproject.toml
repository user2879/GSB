[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-fingerprint-workbench"
version = "0.1.0"
description = "Deterministic, versioned audio fingerprint retrieval workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
fpw = "fingerprint_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["fingerprint_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
