[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphforge"
version = "0.1.0"
description = "Deterministic glyph outline rasterization, atlas packing and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyQt5>=5.15,<6",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<10"]

[project.scripts]
glyphforge = "glyphforge.cli:main"

[tool.setuptools.packages.find]
include = ["glyphforge*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
