[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheproof"
version = "0.1.0"
description = "Deterministic cache-segment capacity proofs and read-view convergence diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cacheproof contributors" }]
dependencies = []

[project.scripts]
cacheproof = "cacheproof.cli:main"

[tool.setuptools.packages.find]
include = ["cacheproof*"]

[tool.setuptools.package-data]
cacheproof = ["py.typed"]

