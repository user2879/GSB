[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "columnar-pipeline"
version = "0.1.0"
description = "Deterministic columnar aggregation pipeline with skew splitting and replayable SQLite ledger"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
columnar-pipeline = "columnar_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
