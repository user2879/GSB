[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-lab"
version = "0.1.0"
description = "Deterministic fixed-point ridge and Lasso path laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
fixed-lab = "fixed_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fixed_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
