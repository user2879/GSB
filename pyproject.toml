[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-audit-workbench"
version = "1.0.0"
description = "Deterministic triangle-mesh repair and fixed-point error audit workbench"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "PySide6==6.8.3",
]

[project.scripts]
mesh-audit = "mesh_audit.cli:main"
mesh-audit-gui = "mesh_audit.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
