[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volrender-cache"
version = "0.1.0"
description = "Deterministic offline volume rendering with geometric block-cache invalidation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
volrender = "volrender.cli:main"

[tool.setuptools.packages.find]
include = ["volrender*"]

