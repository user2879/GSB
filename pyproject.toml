[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shardmeta"
version = "1.0.0"
description = "Diagnosable local multipart-upload metadata accounting component"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
shardmeta-demo = "shardmeta.demo:main"

[tool.setuptools.packages.find]
include = ["shardmeta*"]
exclude = ["tests*", "samples*"]
