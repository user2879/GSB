[project]
name = "cross-coding-ledger"
version = "1.0.0"
description = "Deterministic categorical cross coding, budget adjudication, and replay ledger"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.2.0"]

[project.scripts]
cross-coding = "cross_coding.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
