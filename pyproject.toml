[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsb-join-lab"
version = "1.0.0"
description = "Local deterministic equi-join estimation and sampling diagnostics lab"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
gsb-join-lab = "gsb.cli:main"

[tool.setuptools.packages.find]
include = ["gsb*"]
