[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "near-dup-ledger"
version = "1.0.0"
description = "Deterministic incremental near-duplicate cluster ledger for local Chinese short texts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["near_dup*"]

