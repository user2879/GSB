[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaindiag"
version = "1.0.0"
description = "Deterministic fixed-point embedding and aggregation chain diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
chaindiag = "chaindiag.cli:main"

[tool.setuptools.packages.find]
include = ["chaindiag*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
