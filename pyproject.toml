[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-surface-lab"
version = "0.1.0"
description = "Deterministic versioned NURBS CAD geometry and offscreen display demo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyOpenGL>=3.1"]

[project.scripts]
cad-surface = "cad_surface.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
