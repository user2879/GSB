[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-log-sampler"
version = "0.1.0"
description = "Deterministic, incremental diagnostic sampler for device log review"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy"]

[project.scripts]
log-sampler = "log_sampler.cli:main"

[tool.setuptools.packages.find]
include = ["log_sampler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

