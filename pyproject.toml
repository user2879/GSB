[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecalib"
version = "1.0.0"
description = "Deterministic fixed-point voice emotion evidence calibration component"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
