[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamparse-deterministic"
version = "1.0.0"
description = "Budget-aware deterministic streaming instruction parser for local synthetic samples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
streamparse = "streamparse.cli:main"

[tool.setuptools]
packages = ["streamparse"]
