[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-chart-calibration"
version = "1.0.0"
description = "Deterministic synthetic-chart axis calibration and data-point recovery workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
]

[project.scripts]
chart-workbench = "chart_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["chart_workbench*"]
