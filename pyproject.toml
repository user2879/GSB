[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ledger"
version = "0.1.0"
description = "Deterministic incremental sample construction ledger"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.scripts]
edge-ledger = "edge_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["edge_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

