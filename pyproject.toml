[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-pipeline"
version = "1.0.0"
description = "Deterministic incremental feature, training, inference, and summary pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
domain-pipeline = "domain_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
