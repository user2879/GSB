[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardrep"
version = "1.0.0"
description = "Local deterministic shard replica repair and budgeted repacking middleware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
windows = ["numpy>=1.24"]

[project.scripts]
shardrep = "shardrep.cli:main"

[tool.setuptools]
packages = ["shardrep"]

