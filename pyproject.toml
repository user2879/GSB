[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcal-saturation"
version = "1.0.0"
description = "Deterministic per-tensor scale/zero-point calibration, fixed-point requantization and saturation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
quantcal = "quantcal.cli:main"

[tool.setuptools]
packages = ["quantcal"]
