[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pickworkbench"
version = "1.0.0"
description = "Deterministic picking and spatial-operation validation workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2"]

[project.scripts]
pickworkbench = "pickworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["pickworkbench*"]
