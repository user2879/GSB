[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-extrapolation-diagnostics"
version = "1.0.0"
description = "Deterministic, auditable RoPE extrapolation diagnostics for long-context attention deployment checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
rope-diag = "rope_diag.cli:main"

[tool.setuptools.packages.find]
include = ["rope_diag*"]

