[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-pagecache"
version = "1.0.0"
description = "Deterministic columnar page cache, spill manager, and verifier"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools]
packages = ["pagecache", "samples"]
