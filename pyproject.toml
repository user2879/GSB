[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-search-prototype"
version = "0.1.0"
description = "Deterministic fixed-point inverted-index and BM25-style ranking prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
search-proto = "search_proto.cli:main"

[tool.setuptools.packages.find]
include = ["search_proto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

