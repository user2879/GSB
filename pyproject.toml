[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lossdiag-workbench"
version = "1.0.0"
description = "Deterministic loss observation reconciliation and diagnosis workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
lossdiag = "lossdiag.cli:main"

[tool.setuptools.packages.find]
include = ["lossdiag*"]

