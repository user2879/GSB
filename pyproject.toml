[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adw-deterministic-diagnostics"
version = "1.0.0"
description = "Local deterministic anomaly-detection diagnostic workbench"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
adw = "adw.cli:main"

[tool.setuptools.packages.find]
include = ["adw*"]
