[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeldash-workbench"
version = "1.0.0"
description = "Deterministic local model-configuration dispatch and replay workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
modeldash = "modeldash.cli:main"

[tool.setuptools.packages.find]
include = ["modeldash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
