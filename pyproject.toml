[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-lease-arbitrator"
version = "1.0.0"
description = "Cross-node artifact cache lease arbitration middleware"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
lease-arbitrator = "lease_arbitrator.cli:main"

[tool.setuptools.packages.find]
include = ["lease_arbitrator*"]
