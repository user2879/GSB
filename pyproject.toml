[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-transfer-pipeline"
version = "1.0.0"
description = "Deterministic local incremental cross-task transfer-learning pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["transfer_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
