[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscan"
version = "0.1.0"
description = "Deterministic vectorized scan over local columnar files"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vscan = "vscan.cli:main"

[tool.setuptools.packages.find]
include = ["vscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
