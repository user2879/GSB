[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-diag"
version = "0.1.0"
description = "Deterministic local log and trace sampling diagnostics workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
trace-diag = "trace_diag.cli:main"

[tool.setuptools.packages.find]
include = ["trace_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
