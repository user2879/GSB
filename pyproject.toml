[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-quota-editor"
version = "1.0.0"
description = "Local storage quota and rate-limit configuration editor with a SQLite ledger"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quota-app = "quota_app.cli:main"

[tool.setuptools.packages.find]
include = ["quota_app*"]
