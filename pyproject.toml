[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replica-repair"
version = "1.0.0"
description = "Local deterministic replica manifest interoperability and repair component"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
replica-repair = "replica_repair.cli:main"

[tool.setuptools.packages.find]
include = ["replica_repair*"]
