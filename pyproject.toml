[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qplan-diagnostics"
version = "0.1.0"
description = "Local SQLite query-plan and index-selection diagnostics platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2"]

[project.scripts]
qplan = "qplan.cli:main"

[tool.setuptools.packages.find]
include = ["qplan*"]

