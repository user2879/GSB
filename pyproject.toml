[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-cache-workbench"
version = "1.0.0"
description = "Deterministic cross-node lease and capacity-watermark diagnostic workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cache-workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
