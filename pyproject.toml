[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lateness-ledger"
version = "0.1.0"
description = "Deterministic event-time window lateness displacement and watermark ledger diagnostics workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
lateness-ledger = "lateness_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["lateness_ledger*"]
