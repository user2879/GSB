[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-forensics-workbench"
version = "1.0.0"
description = "Offline deterministic audit-event correlation and forensics workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "jsonschema>=4.18",
  "pytest>=7.4",
]

[project.scripts]
audit-forensics = "audit_forensics.cli:main"

[tool.setuptools.packages.find]
include = ["audit_forensics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
