[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-experiment-tracker"
version = "1.0.0"
description = "Deterministic local experiment tracking, upgrade, replacement and snapshot replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
exptrack = "exp_tracker.cli:main"

[tool.setuptools]
packages = ["exp_tracker"]

[tool.unittest]
start-directory = "tests"

