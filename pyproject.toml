[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsb-eventbus"
version = "0.1.0"
description = "Deterministic loopback event-bus subscription pipeline with tri-format receipts and SQLite ledger"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
gsb = "gsb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
