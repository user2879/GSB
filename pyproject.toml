[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcalib"
version = "0.1.0"
description = "Deterministic per-layer quant calibration, lightweight distillation correction and receipt-ledger engine"
readme = "README.quantcalib.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.scripts]
quantcalib = "quantcalib.cli.main:main"

[tool.setuptools.packages.find]
include = ["quantcalib*"]
