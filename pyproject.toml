[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panorama-mask-workbench"
version = "0.1.0"
description = "Deterministic panoramic segmentation and mask post-processing workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "Pillow>=9.0"]

[project.scripts]
panorama-workbench = "panorama_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["panorama_workbench*"]
