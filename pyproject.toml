[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-workbench"
version = "1.0.0"
description = "Deterministic local multichannel acoustic measurement and calibration diagnostics workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "PyQt6==6.12.1",
]

[project.scripts]
acoustic-workbench = "acoustic_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["acoustic_workbench*"]

[tool.setuptools]
include-package-data = true
