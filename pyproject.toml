[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlab"
version = "1.0.0"
description = "Deterministic fixed-point search intent and slot diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
intentlab = "intentlab.cli:main"

[tool.setuptools.packages.find]
include = ["intentlab*"]

[tool.unittest]
start-directory = "tests"

