[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mvrv-diagnostics"
version = "1.0.0"
description = "Deterministic fixed-point multi-view 3D reconstruction and multi-resolution voxel occupancy diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
mvrv = "mvrv.cli:main"

[tool.setuptools.packages.find]
include = ["mvrv*"]

[tool.unittest]
start-dir = "tests"
