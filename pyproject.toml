[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-command-diagnostics"
version = "0.1.0"
description = "Deterministic, incremental diagnostics for registered voice-command templates"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
voice-diag = "voice_diag.cli:main"

[tool.setuptools.packages.find]
include = ["voice_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
