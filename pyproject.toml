[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsseg-incremental"
version = "1.0.0"
description = "Deterministic multi-band remote-sensing tile semantic segmentation with incremental inference"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "Pillow==13.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["rsseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
