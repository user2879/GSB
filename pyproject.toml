[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecache-lease-dispatcher"
version = "1.0.0"
description = "Deterministic edge-cache shard lease dispatcher with SQLite replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
edgecache = "edgecache.cli:main"

[tool.setuptools.packages.find]
include = ["edgecache*"]
