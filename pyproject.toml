[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockledger"
version = "1.0.0"
description = "Deterministic block snapshot, rollback, verification and ledger replay toolkit"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
blockledger = "blockledger.cli:main"

[tool.setuptools.packages.find]
include = ["blockledger*"]

[tool.unittest]
start = "tests"
