[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-isolation-lab"
version = "1.0.0"
description = "Deterministic SQLite row-lock and transaction-isolation laboratory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
isolation-lab = "isolation_lab.cli:main"

[tool.setuptools.packages.find]
include = ["isolation_lab*"]
