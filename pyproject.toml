[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shard-db-diagnostics"
version = "1.0.0"
description = "Local deterministic database-side diagnostics for shard dispatch"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
include = ["shard_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
