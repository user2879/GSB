[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-tokens"
version = "1.0.0"
description = "Local multi-node shard dispatch permit tokens with integer fixed-point token buckets"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pytest==8.2.0",
]

[project.scripts]
dispatch-tokens = "dispatch_tokens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
