[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgsynth"
version = "1.0.0"
description = "Deterministic vector path flattening, rasterization, compositing, and verification"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PySide6>=6.7"]

[project.scripts]
vgsynth = "vgsynth.cli:main"

[tool.setuptools.packages.find]
include = ["vgsynth*"]
