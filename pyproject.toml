[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-material-workspace"
version = "1.0.0"
description = "Deterministic spectral material, colour adaptation and recovery workspace"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
packages = ["spectral_workspace"]
