[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probcal"
version = "1.0.0"
description = "Deterministic tabular probability calibration with audited incremental reuse"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[tool.setuptools]
packages = ["probcal"]
