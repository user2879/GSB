[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvcc-lab"
version = "1.0.0"
description = "可独立复核的 MVCC 可见性诊断组件"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["mvcc_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
