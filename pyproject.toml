[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphforge"
version = "1.0.0"
description = "Deterministic vector outline booleans, stroke expansion, and coverage rasterization"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
glyphforge = "glyphforge.__main__:main"

[tool.setuptools.packages.find]
include = ["glyphforge*"]
