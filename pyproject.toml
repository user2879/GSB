[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-diagnostics-workbench"
version = "1.0.0"
description = "Deterministic clustering, density diagnostics, budget scheduling and snapshot audit workbench"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
cluster-workbench = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["clustering_workbench*"]

[tool.setuptools.package-data]
clustering_workbench = ["static/*"]
