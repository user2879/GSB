[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibpipe-drift"
version = "1.0.0"
description = "Deterministic fixed-point vibration feature pipeline and drift diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.scripts]
vibpipe = "vibpipe.cli:main"

[tool.setuptools.packages.find]
include = ["vibpipe*"]
