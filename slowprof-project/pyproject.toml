[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowprof"
version = "1.0.0"
description = "Local slow-request stack profiling, hotspot ranking and fixed-point error annotation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "slowprof" }]
dependencies = []

[project.optional-dependencies]
numeric = ["numpy"]
dev = ["numpy"]

[project.scripts]
slowprof = "slowprof.cli:main"

[tool.setuptools]
packages = ["slowprof"]
