[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-pipeline"
version = "0.1.0"
description = "Deterministic pretraining corpus sampling, near-duplicate attribution, and incremental ledger pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "PyYAML>=6.0"]

[project.scripts]
corpus-pipeline = "corpus_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["corpus_pipeline*"]
