    bits: 16
    level: int16
    group_size: 8
    frac_bits: 10
    scheme: sym
  fusion_block:
    bits: 4
    level: int4
    group_size: 2
    frac_bits: 4
distill:
  temperature: 2.0
  steps: 3
  soft_weight: 0.4
  learning_rate: 0.1
  tolerance: 0.35
budgets:
  global_cal_points: 10
  batch_quant_points: 16
  per_layer:
    fusion_block: 4
