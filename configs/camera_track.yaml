  - {t: 2.0, pos: [2400.0, 900.0, 450.0], target: [2700.0, 2300.0, 250.0]}
  - {t: 3.0, pos: [3200.0, 2400.0, 400.0], target: [2700.0, 3300.0, 200.0]}
