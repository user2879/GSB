data:
  spec_file: ../data/data_spec.yaml
  overrides_file: ../data/sample_overrides.yaml
features:
  numeric:
  - age
  - income
  - tenure
  - activity
  - income_redundant
  - risk_score
  categorical:
  - region
  - segment
target: target
split:
  train_ratio: 0.72
models:
- name: logreg-compact
  type: logistic_regression
  candidates:
  - learning_rate: 0.12
    epochs: 90
    batch_size: 16
    l2: 0.0005
- name: logreg-regularized
  type: logistic_regression
  candidates:
  - learning_rate: 0.06
    epochs: 120
    batch_size: 24
    l2: 0.002
- name: tree-shallow
  type: decision_tree
  candidates:
  - max_depth: 3
    min_samples_leaf: 5
    min_gain: 0.0001
- name: tree-full
  type: decision_tree
  candidates:
  - max_depth: 5
    min_samples_leaf: 3
    min_gain: 1.0e-05
calibrators:
  raw:
    enabled: true
    regularization: '0'
  platt:
    enabled: true
    regularization: '0.0005'
    learning_rate: '0.2'
    iterations: 120
  isotonic:
    enabled: true
    bins: 8
    regularization: '0.5'
  histogram:
    enabled: true
    bins: 10
    regularization: '0.5'
evaluation:
  calibration_bins: 8
  threshold_step: '0.05'
  fixed_point:
    decimal_places: 6
    quantization_levels: 1000000
concurrency:
  max_workers: 4
snapshot:
  commit_interval: 2
